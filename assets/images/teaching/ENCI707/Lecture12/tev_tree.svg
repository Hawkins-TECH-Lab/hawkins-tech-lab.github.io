<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" width="820" height="370" font-family="Helvetica, Arial, sans-serif">
  <!-- Source: tikz/tev_tree.tex -->
  <rect width="820" height="370" fill="#ffffff"/>
  <!-- connectors -->
  <g fill="none" stroke="#757575" stroke-width="2">
    <path d="M410,64 V92 H200 V120"/>
    <path d="M410,92 H560 V120"/>
    <path d="M560,170 V200 H380 V230"/>
    <path d="M500,200 V230"/>
    <path d="M620,200 V230"/>
    <path d="M560,200 H740 V230"/>
  </g>
  <!-- boxes -->
  <rect x="295" y="20" width="230" height="44" rx="8" fill="#1b1b1b"/>
  <rect x="110" y="120" width="180" height="50" rx="8" fill="#eef3f9" stroke="#3b6ea8" stroke-width="2"/>
  <rect x="440" y="120" width="240" height="50" rx="8" fill="#e8f3e8" stroke="#2e7d32" stroke-width="2"/>
  <g fill="#ffffff" stroke="#2e7d32" stroke-width="1.5">
    <rect x="325" y="230" width="110" height="50" rx="6"/>
    <rect x="445" y="230" width="110" height="50" rx="6"/>
    <rect x="565" y="230" width="110" height="50" rx="6"/>
    <rect x="685" y="230" width="110" height="50" rx="6"/>
  </g>
  <!-- labels -->
  <text x="410" y="48" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Total economic value</text>
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="200" y="151" fill="#3b6ea8">Use value (UV)</text>
    <text x="560" y="143" fill="#2e7d32">Non-use (passive-use)</text>
    <text x="560" y="162" fill="#2e7d32">value</text>
  </g>
  <g font-size="15" text-anchor="middle" fill="#1b1b1b">
    <text x="380" y="252">Existence</text><text x="380" y="270" font-size="13" fill="#616161">EV</text>
    <text x="500" y="252">Stewardship</text><text x="500" y="270" font-size="13" fill="#616161">SV</text>
    <text x="620" y="252">Bequest</text><text x="620" y="270" font-size="13" fill="#616161">BV</text>
    <text x="740" y="252">Option</text><text x="740" y="270" font-size="13" fill="#616161">OV</text>
  </g>
  <g font-size="14" font-style="italic" text-anchor="middle" fill="#616161">
    <text x="200" y="200">recreation, fishing,</text>
    <text x="200" y="218">water supply</text>
  </g>
  <!-- what can measure it -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="80" y="318" width="240" height="32" rx="16" fill="#3b6ea8"/>
    <text x="200" y="339" fill="#ffffff">revealed + stated preference</text>
    <rect x="440" y="318" width="240" height="32" rx="16" fill="#2e7d32"/>
    <text x="560" y="339" fill="#ffffff">stated preference only</text>
  </g>
</svg>
