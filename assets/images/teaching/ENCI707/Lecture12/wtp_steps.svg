<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="700" height="430" font-family="Helvetica, Arial, sans-serif">
  <!-- Source: tikz/wtp_steps.tex.  Origin (80,380); 50 px per unit on n, 30 px per unit on r_n; p = 2.7 -->
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b1b1b"/>
    </marker>
  </defs>
  <rect width="700" height="430" fill="#ffffff"/>
  <!-- consumer surplus (blue) -->
  <g fill="#3b6ea8" stroke="#ffffff" stroke-width="1">
    <rect x="80"  y="80"  width="50" height="219"/>
    <rect x="130" y="110" width="50" height="189"/>
    <rect x="180" y="140" width="50" height="159"/>
    <rect x="230" y="170" width="50" height="129"/>
    <rect x="280" y="200" width="50" height="99"/>
    <rect x="330" y="230" width="50" height="69"/>
    <rect x="380" y="260" width="50" height="39"/>
    <rect x="430" y="290" width="50" height="9"/>
  </g>
  <!-- expenditure (yellow) -->
  <g fill="#f2c94c" stroke="#ffffff" stroke-width="1">
    <rect x="80"  y="299" width="50" height="81"/>
    <rect x="130" y="299" width="50" height="81"/>
    <rect x="180" y="299" width="50" height="81"/>
    <rect x="230" y="299" width="50" height="81"/>
    <rect x="280" y="299" width="50" height="81"/>
    <rect x="330" y="299" width="50" height="81"/>
    <rect x="380" y="299" width="50" height="81"/>
    <rect x="430" y="299" width="50" height="81"/>
  </g>
  <!-- units not bought -->
  <g fill="#eeeeee" stroke="#bdbdbd" stroke-width="1">
    <rect x="480" y="320" width="50" height="60"/>
    <rect x="530" y="350" width="50" height="30"/>
  </g>
  <!-- marginal WTP step curve -->
  <path d="M80,80 H130 V110 H180 V140 H230 V170 H280 V200 H330 V230 H380 V260 H430 V290 H480 V320 H530 V350 H580 V380"
        fill="none" stroke="#c62828" stroke-width="4" stroke-linejoin="miter"/>
  <!-- price line -->
  <line x1="80" y1="299" x2="620" y2="299" stroke="#2e7d32" stroke-width="4"/>
  <text x="628" y="305" font-size="20" font-style="italic" fill="#2e7d32">p</text>
  <!-- axes -->
  <g stroke="#1b1b1b" stroke-width="2" marker-end="url(#ax)">
    <line x1="80" y1="380" x2="640" y2="380"/>
    <line x1="80" y1="380" x2="80" y2="45"/>
  </g>
  <text x="648" y="386" font-size="20" font-style="italic">n</text>
  <text x="60" y="42" font-size="20" font-style="italic">r<tspan font-size="14" dy="5">n</tspan></text>
  <!-- ticks -->
  <g font-size="14" text-anchor="middle" fill="#424242">
    <text x="105" y="400">1</text><text x="155" y="400">2</text><text x="205" y="400">3</text>
    <text x="255" y="400">4</text><text x="305" y="400">5</text><text x="355" y="400">6</text>
    <text x="405" y="400">7</text><text x="455" y="400">8</text><text x="505" y="400">9</text>
    <text x="555" y="400">10</text>
  </g>
  <g font-size="14" text-anchor="end" fill="#424242">
    <text x="70" y="385">0</text><text x="70" y="325">2</text><text x="70" y="265">4</text>
    <text x="70" y="205">6</text><text x="70" y="145">8</text><text x="70" y="85">10</text>
  </g>
  <!-- annotations -->
  <text x="190" y="255" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Consumer surplus</text>
  <text x="280" y="345" font-size="16" font-weight="bold" fill="#1b1b1b" text-anchor="middle">Expenditure = p × 8</text>
  <g font-size="15" fill="#c62828">
    <text x="420" y="140">Reservation prices</text>
    <text x="420" y="159">(marginal WTP curve)</text>
  </g>
  <line x1="418" y1="165" x2="345" y2="226" stroke="#c62828" stroke-width="1.5"/>
  <text x="590" y="350" font-size="13" fill="#757575">not bought:</text>
  <text x="590" y="366" font-size="13" fill="#757575">r<tspan font-size="10" dy="3">n</tspan><tspan dy="-3"> &lt; p</tspan></text>
</svg>
