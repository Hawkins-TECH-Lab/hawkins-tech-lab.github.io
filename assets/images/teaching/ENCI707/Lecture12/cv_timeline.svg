<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 350" width="1040" height="350" font-family="Helvetica, Arial, sans-serif">
  <!-- Source: tikz/cv_timeline.tex.  x = 60 + 17 * (year - 1960); axis at y = 180 -->
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#424242"/>
    </marker>
  </defs>
  <rect width="1040" height="350" fill="#ffffff"/>
  <!-- EPA programme band -->
  <rect x="230" y="173" width="340" height="14" rx="7" fill="#d6e4f2"/>
  <!-- axis -->
  <line x1="50" y1="180" x2="1010" y2="180" stroke="#424242" stroke-width="2.5" marker-end="url(#ax)"/>
  <g stroke="#424242" stroke-width="1.5">
    <line x1="60" y1="175" x2="60" y2="185"/><line x1="230" y1="175" x2="230" y2="185"/>
    <line x1="400" y1="175" x2="400" y2="185"/><line x1="570" y1="175" x2="570" y2="185"/>
    <line x1="740" y1="175" x2="740" y2="185"/><line x1="910" y1="175" x2="910" y2="185"/>
  </g>
  <g font-size="11" fill="#9e9e9e" text-anchor="middle">
    <text x="60" y="198">1960</text><text x="230" y="198">1970</text><text x="400" y="198">1980</text>
    <text x="570" y="198">1990</text><text x="740" y="198">2000</text><text x="910" y="198">2010</text>
  </g>
  <!-- leaders -->
  <g stroke="#9e9e9e" stroke-width="1.2">
    <line x1="111" y1="174" x2="111" y2="142"/>
    <line x1="298" y1="174" x2="298" y2="142"/>
    <line x1="553" y1="174" x2="553" y2="142"/>
    <line x1="706" y1="174" x2="706" y2="142"/>
    <line x1="621" y1="174" x2="621" y2="88"/>
    <line x1="400" y1="173" x2="400" y2="88"/>
    <line x1="162" y1="186" x2="162" y2="212"/>
    <line x1="383" y1="186" x2="383" y2="212"/>
    <line x1="604" y1="186" x2="604" y2="212"/>
    <line x1="927" y1="186" x2="927" y2="212"/>
    <line x1="638" y1="186" x2="638" y2="282"/>
  </g>
  <!-- event dots -->
  <g fill="#3b6ea8">
    <circle cx="111" cy="180" r="5"/><circle cx="162" cy="180" r="5"/>
    <circle cx="298" cy="180" r="5"/><circle cx="383" cy="180" r="5"/>
    <circle cx="604" cy="180" r="5"/><circle cx="621" cy="180" r="5"/>
  </g>
  <circle cx="553" cy="180" r="6" fill="#c62828"/>
  <g fill="#2e7d32">
    <circle cx="638" cy="180" r="5"/><circle cx="706" cy="180" r="5"/><circle cx="927" cy="180" r="5"/>
  </g>
  <!-- labels: year (bold) + description -->
  <g font-size="13" text-anchor="middle" fill="#1b1b1b">
    <!-- above, level 1 -->
    <text x="111" y="104" font-weight="bold" fill="#3b6ea8">1963</text>
    <text x="111" y="120">Davis: first</text><text x="111" y="136">academic CV study</text>
    <text x="298" y="104" font-weight="bold" fill="#3b6ea8">1974</text>
    <text x="298" y="120">Randall, Ives &amp; Eastman:</text><text x="298" y="136">air-pollution visibility</text>
    <text x="553" y="120" font-weight="bold" fill="#c62828">1989</text>
    <text x="553" y="136">Exxon Valdez spill</text>
    <text x="706" y="104" font-weight="bold" fill="#2e7d32">1998</text>
    <text x="706" y="120">Hanley, Wright &amp;</text><text x="706" y="136">Adamowicz: DCE review</text>
    <!-- above, level 2 -->
    <text x="621" y="50" font-weight="bold" fill="#3b6ea8">1993</text>
    <text x="621" y="66">NOAA panel</text><text x="621" y="82">(Arrow &amp; Solow)</text>
    <text x="400" y="50" font-weight="bold" fill="#3b6ea8">1970s–80s</text>
    <text x="400" y="66">US EPA research</text><text x="400" y="82">programme on CV</text>
    <!-- below, level 1 -->
    <text x="162" y="228" font-weight="bold" fill="#3b6ea8">1966</text>
    <text x="162" y="244">Knetsch &amp; Davis:</text><text x="162" y="260">CV vs travel cost</text>
    <text x="383" y="228" font-weight="bold" fill="#3b6ea8">1979</text>
    <text x="383" y="244">Water Resources Council:</text><text x="383" y="260">CV accepted for</text><text x="383" y="276">federal projects</text>
    <text x="604" y="228" font-weight="bold" fill="#3b6ea8">1992</text>
    <text x="604" y="244">Carson et al.:</text><text x="604" y="260">Exxon Valdez CV</text>
    <text x="927" y="228" font-weight="bold" fill="#2e7d32">2011</text>
    <text x="927" y="244">Carson &amp; Louviere:</text><text x="927" y="260">DCE as a CV</text><text x="927" y="276">elicitation format</text>
    <!-- below, level 2 -->
    <text x="638" y="298" font-weight="bold" fill="#2e7d32">1994</text>
    <text x="638" y="314">Adamowicz, Louviere &amp;</text><text x="638" y="330">Williams: choice experiment</text>
  </g>
  <!-- legend -->
  <g font-size="12" fill="#616161">
    <circle cx="790" cy="40" r="5" fill="#3b6ea8"/><text x="802" y="44">contingent valuation</text>
    <circle cx="790" cy="60" r="5" fill="#2e7d32"/><text x="802" y="64">choice experiments</text>
    <circle cx="790" cy="80" r="5" fill="#c62828"/><text x="802" y="84">trigger event</text>
  </g>
</svg>
