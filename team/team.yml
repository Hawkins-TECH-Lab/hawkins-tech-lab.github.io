# Team roster: the single source of truth for team/index.qmd.
#
# To add someone: copy an entry and edit it. To move someone to alumni, change
# their `group`. Leave a field out (or blank) if you don't have it.
#
# group (decides which section the person appears in):
#   current-grad   Current graduate students
#   current-staff  Research associates / postdocs
#   former-grad    Former graduate students
#   former-staff   Former research associates / postdocs
#   former-ugrad   Former undergraduate research assistants
#   former-hs      Former high school researchers
#
# image: path relative to team/index.qmd; leave out to use the blank avatar.

# ---- Current graduate students ---------------------------------------------
- title: Sam Pollock
  group: current-grad
  role: Ph.D. Student
  institution: University of Calgary
  description: >-
    Sam's research focuses on the safety, comfort, and design of multi-use
    pathways. He is passionate about using preference and behavioural modelling
    to understand transportation choices and encourage people to make healthy
    and sustainable transportation decisions. Sam previously completed his BSc
    and MSc in Civil Engineering at the University of Calgary. Outside
    academia, Sam's interests include coaching speed skating, climbing
    mountains, and baking banana bread.

- title: Mehrnoosh Zare
  group: current-grad
  role: M.Sc. Student
  institution: University of Calgary
  description: >-
    Mehrnoosh is an M.Sc. student in Transportation Engineering. She received
    her M.Sc. in Industrial Engineering with a specialization in Logistics and
    Supply Chain Management from K.N. Toosi University of Technology and her
    B.Sc. in Industrial Engineering from Azad University.

