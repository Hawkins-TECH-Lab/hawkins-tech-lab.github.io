name: Update publications

# Monthly: pull new works from OpenAlex (ORCID) and arXiv, merge them into
# publications/publications.yml, and open a pull request for review.
# Merging the PR triggers the "Publish site" workflow.

on:
  schedule:
    - cron: '0 12 1 * *'   # 1st of each month
  workflow_dispatch:

jobs:
  update-pubs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Fetch and merge publications
        id: sync
        run: |
          python scripts/update_pubs.py | tee sync.log
          {
            echo 'log<<EOF'
            cat sync.log
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # A PAT lets the merge of this PR trigger the publish workflow and
          # avoids needing the "Actions can create PRs" repo setting.
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          branch: auto/update-publications
          delete-branch: true
          add-paths: publications/publications.yml
          commit-message: Update publications from OpenAlex/arXiv
          title: New publications found
          body: |
            Check the suggested `categories` on new entries, and set
            `hidden: true` on anything that shouldn't be listed, before merging.

            ```
            ${{ steps.sync.outputs.log }}
            ```
