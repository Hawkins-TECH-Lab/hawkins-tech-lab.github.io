name: Update Publications

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight UTC
  workflow_dispatch: # Allows you to trigger it manually from the "Actions" tab

jobs:
  update-pubs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create branches/commits
      pull-requests: write # Required to open the PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # <-- This caches your venv packages so future runs are lightning fast!

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest publications
        run: python scripts/update_pubs.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-update publications from arXiv"
          title: "Auto-update publications from arXiv"
          body: "Automated update of publications_by_topic.yml from the arXiv API."
          branch: auto-update-publications
          delete-branch: true
          add-paths: publications/publications_by_topic.yml

      # Install Quarto (required)
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Quarto handles the build AND the gh-pages push all in one step!
      - name: Render and Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
