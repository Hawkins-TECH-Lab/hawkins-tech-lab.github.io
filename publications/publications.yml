- title: 'Better Safety Analyses through Smarter Data: Adding Open-Street-View and Traffic-Calibrated
    Location-Based Services Data to Pedestrian Crash Analysis in Lincoln, NE'
  author: Mohammad S. Elayan, Sagun Karki, Jason Hawkins
  date: '2025-11-24'
  year: '2025'
  journ: Transportation Research Record Journal of the Transportation Research Board
  volume: '2680'
  issue: '7'
  page: 261–274
  pub_number: doi:10.1177/03611981251391714
  doi: 10.1177/03611981251391714
  path: https://doi.org/10.1177/03611981251391714
  url_source: https://doi.org/10.1177/03611981251391714
  categories:
  - General Transport
  type: article
  description: Pedestrian crashes are a significant concern in the U.S., with pedestrian fatalities increasing
    and outpacing those of vehicle occupants. This research investigates the potential of new data sources
    to enhance pedestrian safety analysis and crash modeling. Specifically, it examines the use of StreetLight-calibrated
    traffic volumes and Mapillary detections of street objects for modeling pedestrian crash counts and
    severity. By integrating these innovative data sources, the study aims to improve the accuracy and
    granularity of safety evaluations. Both generalized linear models and machine learning (ML) models,
    including random forests (RF) and gradient boosting machines, demonstrated acceptable performance
    and solid portrayal of crash dynamics, with ML models providing better predictive power at the cost
    of complexity and lower interpretability. Additionally, the weighted RF classifier showed high accuracy
    in predicting crash severity. Key variables in our analysis encompassed StreetLight volumes and various
    Mapillary open street-view detections, including traffic signals, crosswalks, advertisement signs,
    store signs, streetlights, and arrow markings. The association between these variables and crash counts
    and severity aligns with our understanding of crash patterns. Overall, the research underscores the
    importance of leveraging detailed, real-world data to improve pedestrian safety analyses and contribute
    to more effective safety strategies and policy decisions.
