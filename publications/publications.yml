- title: 'The US Economy as a Network: A Comparison across Economic and Environmental Metrics'
  author: Jason Hawkins, Sagun Karki
  date: '2024-07-26'
  year: '2024'
  journ: Sustainability
  volume: '16'
  issue: '15'
  page: 6418–6418
  pub_number: doi:10.3390/su16156418
  doi: 10.3390/su16156418
  path: https://doi.org/10.3390/su16156418
  url_source: https://doi.org/10.3390/su16156418
  categories:
  - General Transport
  type: article
  description: Environmental-economic analysis is an evolving field that seeks to situate the human economy
    within environmental systems through its consumption of environmental resources and cycling of resources
    and waste products back into the environment. Environmental accounting has seen increased focus in
    recent years as national and regional governments look to better track environmental flows to aid
    in policy development and evaluation. This study outlines a conceptual environmental-economic framework
    founded on network science principles. An empirical study operationalizes portions of the framework
    and highlights the need for further research in this area to develop new data sources and analytic
    methods. We demonstrate a spatial mismatch between the location of water-intensive industries and
    the natural location of water resources (i.e., lakes, rivers, and precipitation), which climate change
    is likely to exacerbate. We use eigenvector centrality to measure differences in the US economy according
    to economic trade flow and five associated environmental flow accounts (land use, water consumption,
    energy use, mineral metal use, and greenhouse gas production). Population normalization helps to identify
    low-population counties that play a central role in the environmental-economic system as a function
    of their natural resources.
- title: 'Investigation of factors affecting crash severity of rear-end crashes with high collision speeds
    in work zones: A South Carolina case study'
  author: Mahyar Madarshahian, Jason Hawkins, Nathan N. Huynh, Chowdhury Siddiqui
  date: '2024-07-16'
  year: '2024'
  journ: International Journal of Transportation Science and Technology
  volume: '17'
  page: 361–374
  pub_number: doi:10.1016/j.ijtst.2024.07.003
  doi: 10.1016/j.ijtst.2024.07.003
  path: https://doi.org/10.1016/j.ijtst.2024.07.003
  url_source: https://doi.org/10.1016/j.ijtst.2024.07.003
  categories:
  - Choice Model Methods
  type: article
  description: The aim of this study is to identify factors that affect injury severity levels of work
    zone rear-end crashes with high collision speeds (⩾35 mi/hr). Using statewide crash data provided
    by the South Carolina Department of Transportation from 2014 to 2020, a mixed binary logit model with
    heterogeneity in mean and variance is estimated. The model’s outcome variable is injury or non-injury
    (i.e., property damage only), and the explanatory variables include information related to vehicle,
    collision, time, occupant, roadway, and environmental characteristics. The estimation results indicate
    that the interstate variable is best modeled as a random parameter at 90% confidence level. Late-night
    and dawn/dusk conditions are found to influence the mean effect while driving under the influence
    has an effect on the variance of the random parameter. The factors that positively influence injury
    severity are multi-vehicle involvement, airbag deployment, dark conditions, and crashes involving
    trucks. Conversely, advanced warning area, activity area, lane shift/crossover, young and middle-aged
    drivers, and dawn/dusk conditions have negative effects on injury severity.
- title: Perturbation of Residential Preferences by COVID-19 Shocks in the Greater Toronto Area
  author: Saeed Shakib, Jason Hawkins, Khandker Nurul Habib
  date: '2024-04-09'
  year: '2024'
  journ: Transportation Research Record Journal of the Transportation Research Board
  volume: '2678'
  issue: '12'
  page: 702–719
  pub_number: doi:10.1177/03611981241239650
  doi: 10.1177/03611981241239650
  path: https://doi.org/10.1177/03611981241239650
  url_source: https://doi.org/10.1177/03611981241239650
  categories:
  - Choice Model Methods
  type: article
  description: This research investigates the immediate effects of the COVID-19 pandemic on residential
    preferences in the Greater Toronto Area (GTA), Canada, using a stated preference (SP) survey dataset.
    The study examines changes in relocation preferences and trends in the GTA after the Ontario government
    lifted the initial lockdown. The obtained choice data is then modeled using a mixed cross-nested logit
    model to find substitution patterns across regions and dwelling types, as well as explore residents’
    preferences for different dwelling characteristics and the accessibility of their residence, including
    factors such as telecommuting options. The results reveal that the pandemic caused short-term residential
    dissonance, with residents tending to want to move to lower-density areas to relocate to their preferred
    dwelling type, emphasizing telecommuting as a key factor influencing residential relocation preferences.
    Housing qualities were prioritized over accessibility. The study also found heterogeneous behavior
    among GTA residents with regard to telecommuting as a factor in residential relocation. The study’s
    findings are relevant for planners and policymakers in anticipating the potential long-term pandemic-induced
    home relocation decisions and their impact on future household travel behavior, particularly with
    regard to telecommuting and accessibility.
- title: 'How does upzoning impact land use and transport: a case study of Seattle'
  author: Naifu Fan, Kara Maria Kockelman, Peter Caballero, Jason Hawkins, Xiaohong Chen
  date: '2024-02-06'
  year: '2024'
  journ: Transportation Planning and Technology
  volume: '47'
  issue: '5'
  page: 656–680
  pub_number: doi:10.1080/03081060.2024.2311829
  doi: 10.1080/03081060.2024.2311829
  path: https://doi.org/10.1080/03081060.2024.2311829
  url_source: https://doi.org/10.1080/03081060.2024.2311829
  categories:
  - General Transport
  type: article
  description: This work simulates the long-term land use and transportation impacts of upzoning in the
    region of Seattle, Washington at the parcel level, using UrbanSim and an agent-based travel demand
    model (SoundCast). Scenario results are compared to illuminate differences in a Business-as-Usual
    (BAU) future versus two upzoning scenarios that upzone all single-family-use residential parcels in
    the region or just those in the City of Seattle to 3 dwelling units per parcel. Under BAU, affordability
    falls 20% and rents rise 6% between 2014 and 2050, as the regional population grows to 5.7 million.
    With regional upzoning, 68,400 more dwellings are added, with rents 10% lower compared to the BAU
    future. The housing affordability index falls from 75.3 to 67.31, a significant improvement over the
    BAU scenario's sharper fall to 60.6. If only the City of Seattle upzones, only 3,400 additional units
    are predicted, but rents are 5.2% lower than the BAU case.
- title: A framework for transportation and land use integration as a parallel constrained multiple discrete-continuous
    extreme value (PC-MDCEV) home production model
  author: Jason Hawkins, Khandker Nurul Habib
  date: '2024-01-22'
  year: '2024'
  journ: Transportmetrica B Transport Dynamics
  volume: '12'
  issue: '1'
  pub_number: doi:10.1080/21680566.2024.2303042
  doi: 10.1080/21680566.2024.2303042
  arxiv: '2607.05862'
  path: https://doi.org/10.1080/21680566.2024.2303042
  url_source: https://doi.org/10.1080/21680566.2024.2303042
  url_preprint: https://arxiv.org/abs/2607.05862
  categories:
  - Choice Model Methods
  type: article
  description: We propose a microeconomic foundation for transportation and land use choice model integration
    based on the theory of home production. A utility function is developed that considers both household
    monetary expenditure and individual time use. We introduce a parallel constrained multiple discrete-continuous
    extreme value (MDCEV) structure that allows for the inclusion of multi-person households in the model.
    An empirical application is provided for the Greater Toronto Area using a validated synthetic dataset.
    Empirical results demonstrate an economy of scale in time devoted to home production, analogous to
    scaling exhibit in market production. It was found that the mix of dwelling types (detached, apartment,
    etc.) has a significant influence on both time use and consumption. Finally, we provide several directions
    for future research to advance the practice of urban modelling and better capture the complex dynamics
    of household decision-making.
- title: Supporting decarbonization through vehicle rightsizing, automation, and ride-splitting
  author: Jason Hawkins, Kara Maria Kockelman
  date: '2023-12-25'
  year: '2023'
  journ: Carbon Footprints
  volume: '3'
  issue: '1'
  pub_number: doi:10.20517/cf.2023.46
  doi: 10.20517/cf.2023.46
  path: https://doi.org/10.20517/cf.2023.46
  url_source: https://doi.org/10.20517/cf.2023.46
  categories:
  - Ecological Economics
  - Shared Mobility
  type: article
  description: Vehicle automation and smartphone app-based ride-splitting are commonly discussed topics
    in the transportation literature. While these technologies have been examined for their role in transportation
    decarbonization through simulation study, the motivation for such work is rarely made explicit. In
    this commentary, we provide a motivation for research in this area based on our own simulation research,
    as well as land use and vehicle operational factors. Specifically, land use factors such as density
    and the speed of its adjustment make traditional transit operations using large vehicles cost-prohibitive
    in most U.S. communities (and many other communities around the world). Automation and ride-splitting
    technologies may offer digitized transportation solutions that can match vehicle size to local land
    development density and passenger demand. In addition, we highlight a difference in the supply-demand
    relationship for freight transportation that causes additional challenges for decarbonizing that sector.
    Finally, we emphasize that fleet ownership is key to ensuring timely vehicle fleet turnover as safer
    and more efficient technologies enter the market.
- title: Self-driving vehicles’ impacts on Americans’ long-distance domestic travel choices
  author: Fatemeh Fakhrmoosavi, Priyanka Paithankar, Kara Maria Kockelman, Yantao Huang, Jason Hawkins
  date: '2023-11-30'
  year: '2023'
  journ: Transportation Planning and Technology
  volume: '47'
  issue: '8'
  page: 1262–1276
  pub_number: doi:10.1080/03081060.2023.2288629
  doi: 10.1080/03081060.2023.2288629
  path: https://doi.org/10.1080/03081060.2023.2288629
  url_source: https://doi.org/10.1080/03081060.2023.2288629
  categories:
  - Vehicle Adoption
  type: article
  description: This research estimated models for long-distance domestic passenger trips before and after
    the introduction of autonomous vehicles (AVs) and their application to a 10% synthetic US population.
    The authors synthesized 12.1M households and 28.1M individuals across 73,056 US census tracts. To
    generate disaggregated passenger trips, travel demand models, including trip frequency, season, purpose,
    party size, mode choice, and destination choice, and vehicle ownership models were estimated. Different
    datasets, including a 2021 long-distance AV survey, 2016/17 National Household Travel Survey (NHTS)
    survey, EPA Smart Location data, and FHWA rJourney dataset were used for model estimation. The model
    applications indicated AV ownership to be 0.33 per capita after the introduction of AVs within the
    marketplace with a $3500 AV technology cost premium in the year 2040. Total person-miles traveled
    per capita in long-distance trips was also estimated to rise 35% (from 280 to 379 miles per month).
