- title: 'Mobility Behavior Evolution During Extended Emergencies: Returners, Explorers, and the 15-Minute
    City'
  author: Omid Armantalab, Jason Hawkins, Wissam Kontar
  date: '2025-10-01'
  year: '2025'
  journ: arXiv Preprint
  pub_number: arXiv:2510.00469
  arxiv: '2510.00469'
  path: https://arxiv.org/abs/2510.00469
  url_preprint: https://arxiv.org/abs/2510.00469
  categories:
  - General Transport
  type: preprint
  description: 'Understanding human mobility during emergencies is critical for strengthening urban resilience
    and guiding emergency management. This study examines transitions between returners, who repeatedly
    visit a limited set of locations, and explorers, who travel across broader destinations, over a 15-day
    emergency period in a densely populated metropolitan region using the YJMob100K dataset. High-resolution
    spatial data reveal intra-urban behavioral dynamics often masked at coarser scales. Beyond static
    comparisons, we analyze how mobility evolves over time, with varying emergency durations, across weekdays
    and weekends, and relative to neighborhood boundaries, linking the analysis to the 15-minute city
    framework. Results show that at least two weeks of data are required to detect meaningful behavioral
    shifts. During prolonged emergencies, individuals resume visits to non-essential locations more slowly
    than under normal conditions. Explorers markedly reduce long distance travel, while weekends and holidays
    consistently exhibit returner-like, short distance patterns. Residents of low Points of Interest (POI)
    density neighborhoods often travel to POI rich areas, highlighting spatial disparities. Strengthening
    local accessibility may improve urban resilience during crises. Full reproducibility is supported
    through the project website: https://github.com/wissamkontar'
- title: Mapping Vehicle Diffusion Dynamics in the United States
  author: Hania Afzal, Omid Armantalab, Jason Hawkins
  date: '2025-08-20'
  year: '2025'
  journ: Transportation Research Record Journal of the Transportation Research Board
  volume: '2679'
  issue: '11'
  page: 335–349
  pub_number: doi:10.1177/03611981251347621
  doi: 10.1177/03611981251347621
  path: https://doi.org/10.1177/03611981251347621
  url_source: https://doi.org/10.1177/03611981251347621
  categories:
  - Vehicle Adoption
  type: article
  description: Household vehicle fleet composition is an important dimension of transportation policy
    and planning. Vehicle choice and diffusion may be considered as a function of two network dimensions.
    First, spatial proximity may be associated with diffusion of a new vehicle powertrain, category, or
    model. A household purchases a vehicle based on local incentives or seeing the vehicle on the road.
    Second, social proximity as measured by similarity in demographics. We use a historical county-level
    vehicle registrations database for the United States to examine these factors. Results of the Moran
    I coefficient of correlation confirm the spatial diffusion phenomena for plugin electric vehicles
    (PEV)—including battery and plug-in hybrid electric, hybrid electric vehicles (HEV), hydrogen fuel
    cell electric vehicles (FCEVs), and US brand vehicles. The spatial autoregressive (SAR) model is estimated
    to measure the spatial diffusion effect after accounting for demographic variables associated with
    social diffusion. Larger county populations are linked to higher PEV and HEV adoption rates but lower
    US brand vehicle ownership. Elevated state grid eqCO 2 intensity is associated with higher adoption
    rates for both PEV and HEV. Centrally located states maintain high US brand vehicle ownership rates,
    while West and East Coast states show consistently low rates, with declining diffusing into neighboring
    regions.
- title: 'Integrating StreetLight Data, EPS Smart Location Data, and Road Attributes: A Random Forest
    Approach to Multimodal Traffic Calibration in Lincoln, Nebraska'
  author: Mohammad S. Elayan, Nicholas Aldridge, Jason Hawkins, Yunwoo Nam
  date: '2025-06-12'
  year: '2025'
  journ: Journal of Transportation Engineering Part A Systems
  volume: '151'
  issue: '8'
  pub_number: doi:10.1061/jtepbs.teeng-8949
  doi: 10.1061/jtepbs.teeng-8949
  path: https://doi.org/10.1061/jtepbs.teeng-8949
  url_source: https://doi.org/10.1061/jtepbs.teeng-8949
  categories:
  - General Transport
  type: article
  description: The growing availability of location-based services (LBS) data has made networkwide traffic
    inference a feasible and valuable tool for traffic analysis. This paper utilizes LBS data from the
    commercial data vendor StreetLight data, along with a comprehensive data set of multimodal traffic
    counts, to estimate vehicle, pedestrian, and bicycle volumes across all road segments in Lincoln,
    Nebraska. By incorporating land use, built environment, and sociodemographic features from the EPA
    Smart Location Database (EPA-SLD) and road attributes, the random forest models demonstrated strong
    predictive performance across all modes, with R2 values exceeding 0.99 for all three models. However,
    statistical tests revealed that the traffic count locations represent a biased sample, and significant
    differences exist in the model predictors between training and prediction samples. Although the predictive
    accuracy is high for the selected high-volume intersections, accuracy may be lower on less trafficked
    segments, highlighting the need for further model refinement.
