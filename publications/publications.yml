- title: 'Assessing the impacts of COVID-19 on urban passenger travel demand in the greater Toronto area:
    description of a multi-pronged and multi-staged study with initial results'
  author: Khandker Nurul Habib, Jason Hawkins, Saeed Shakib, Patrick Loa, Sk. Md. Mashrur, Alireza Dianat,
    Kaili Wang, Sanjana Hossain, Yicong Liu
  date: '2021-03-10'
  year: '2021'
  journ: Transportation Letters
  volume: '13'
  issue: 5-6
  page: 353–366
  pub_number: doi:10.1080/19427867.2021.1899579
  doi: 10.1080/19427867.2021.1899579
  path: https://doi.org/10.1080/19427867.2021.1899579
  url_source: https://doi.org/10.1080/19427867.2021.1899579
  categories:
  - General Transport
  type: article
  description: The COVID-19 outbreak created a context that was not previously considered by most urban
    transportation planners and modellers. This paper presents a study design to comprehensively measure
    the effects of COVID-19 induced Lockdown on changes in travel behaviour and its dynamics. The study
    is designed for the Greater Toronto Area. The paper presents results from the common portion of four
    specialized travel surveys. The empirical investigation presented in the paper is on the general pandemic
    response, in terms of daily activity-travel adaptation behaviour), in the context of around four months
    of complete Lockdown to stop the spread of COVID-19. Empirical investigation reveals that the Lockdown
    did not cause any substantial increase in unemployment, but it did force the majority of the residents
    to telecommute and practice flexible office hours. Overall, results show that Lockdown influences
    people to engage in more family-oriented activities.
- title: Finding the Subway Disruption Regimes of Switching Subway to Uber in Toronto
  author: Jason Hawkins, Khandker Nurul Habib
  date: '2020-10-09'
  year: '2020'
  journ: Transportation Research Record Journal of the Transportation Research Board
  volume: '2674'
  issue: '12'
  page: 303–311
  pub_number: doi:10.1177/0361198120953797
  doi: 10.1177/0361198120953797
  path: https://doi.org/10.1177/0361198120953797
  url_source: https://doi.org/10.1177/0361198120953797
  categories:
  - Shared Mobility
  type: article
  description: 'The evolving relationship between public transit and transportation network companies
    (TNCs), such as Uber and Lyft, is of great interest to government agencies and has seen much critical
    attention in the academic literature. In this paper, we focus on the demand for TNC trips (also known
    as ride-hailing trips) during the disruption of the subway service. We combined a detailed dataset
    of Uber trips made in Toronto, Canada during the period September 2016 to August 2018 and subway disruption
    data provided by the Toronto Transit Commission. These data were used to examine the question: how
    long are subway users willing to wait during a disruption before switching modes? This question was
    framed as a threshold point, and an innovative structural threshold regression model was used to obtain
    an answer. Controlling for environmental and location-specific factors in the model, it was revealed
    that subway users in Toronto tend to switch to Uber after a service delay of as little as 3 min, with
    an average result of 7 min and an upper bound of 12 min.'
- title: 'Travel distance and land use: a generalized Box–Cox model with conditional spatial lag dependence'
  author: Jason Hawkins, Khandker Nurul Habib
  date: '2020-10-01'
  year: '2020'
  journ: Transportmetrica A Transport Science
  volume: '17'
  issue: '4'
  page: 1101–1121
  pub_number: doi:10.1080/23249935.2020.1831649
  doi: 10.1080/23249935.2020.1831649
  path: https://doi.org/10.1080/23249935.2020.1831649
  url_source: https://doi.org/10.1080/23249935.2020.1831649
  categories:
  - General Transport
  type: article
  description: Disentangling individual contributions to travel distance continues to be an active field
    of research, with advances in econometrics being germane. In this study, we focus on several econometric
    techniques, some of which have been applied in isolation in past studies, but the combination of which
    has yet to be applied to the problem. We apply a series of statistical tests using the method of artificial
    regression to test the joint effects of functional form and spatial autocorrelation on model fit.
    An empirical application is made to the Greater Toronto Area using a large-scale travel survey. Several
    results found in past studies are refuted through the use of advanced econometric methods, including
    the previous finding of a positive correlation between travel distance and density in the study region.
    Model results are validated using bootstrapped sampling and local indicators of spatial association.
- title: Evaluating pedestrian perceptions of street design with a 3D stated preference survey
  author: Dena Kasraian, Sneha Adhikari, David Kossowsky, Michael Luubert, G. Brent Hall, Jason Hawkins,
    Khandker Nurul Habib, Matthew J. Roorda
  date: '2020-08-25'
  year: '2020'
  journ: Environment and Planning B Urban Analytics and City Science
  volume: '48'
  issue: '7'
  page: 1787–1805
  pub_number: doi:10.1177/2399808320946050
  doi: 10.1177/2399808320946050
  path: https://doi.org/10.1177/2399808320946050
  url_source: https://doi.org/10.1177/2399808320946050
  categories:
  - Choice Model Methods
  type: article
  description: In many places, streets are still primarily designed for the convenience of motorists,
    considering mobility function as the principal design goal. There is a scarcity of empirical evidence
    on the relationship between the design of a street and how it is experienced by pedestrians who use
    it. This work focuses on quantifying pedestrians’ perception of walkability through a stated preference
    survey using a dynamic 3D representation of various street designs in Toronto, Canada. The stated
    preference scenarios are generated through a rule-based 3D environment (Esri’s CityEngine) and animated
    using a gaming engine (Unity). A random sample of 600 Torontonians is used for the empirical investigation
    by estimating a mixed multinomial logit model. The results indicate that there is a high preference
    for (i) streets that include transit lanes as opposed to car-exclusive lanes, (ii) the presence of
    trees on the sidewalk, and (iii) two-way cycle paths on the curb lane. Furthermore, pedestrians are
    willing to trade sidewalk width for the presence of trees and outdoor dining. The survey’s innovative
    presentation mode and its findings can contribute to the development of much-needed evidence-based
    design tools to assess the trade-offs required between the many possible uses of roadway space, while
    focusing on the overlooked role of the pedestrian experience.
