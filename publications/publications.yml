- title: An EVSE equity analysis framework considering differential job access
  author: Donya Negahbani, Ben Aaron, Jason Hawkins
  date: '2026-09-01'
  year: '2026'
  journ: International Journal of Urban Sciences
  page: 1–27
  pub_number: doi:10.1080/12265934.2026.2724069
  doi: 10.1080/12265934.2026.2724069
  path: https://doi.org/10.1080/12265934.2026.2724069
  url_source: https://doi.org/10.1080/12265934.2026.2724069
  categories:
  - Equity
  - Vehicle Adoption
  type: article
  description: 'To address the risk of a widening rural–urban divide in electric vehicle (EV) charging
    access, this study examines public charging infrastructure deployment through the lens of travel alternatives
    and land-use differences. We argue that planning for electric vehicle supply equipment (EVSE) must
    account for differences in the ability to replace private car trips with other transportation modes
    or online alternatives. We analyze nationwide travel patterns for urban and rural populations in the
    U.S., sequentially excluding trips that could be substituted (such as non-driving commutes or shopping
    via e-commerce), to identify relative charging needs and to evaluate the equity of current charging
    infrastructure distribution. Using job accessibility as a novel measure of rurality, our analysis
    reveals that rural residents travel significantly longer distances daily, and that limited job access
    (as a proxy for limited amenity access) corresponds to greater dependence on private vehicles. We
    introduce an equity assessment framework based on the Lorenz curve, extended with a Cobb–Douglas-style
    joint metric of job access and EVSE access, to evaluate how well charging infrastructure serves different
    communities. This framework highlights substantial disparities in public charging availability: we
    characterize and quantify the current distribution of public EVSE provision across accessibility contexts
    across the U.S. as of 2024, underscoring the need for more inclusive charging infrastructure planning.'
