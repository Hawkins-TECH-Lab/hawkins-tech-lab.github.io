- title: Multiscale carbon burden of infrastructure in the United States
  author: Jason Hawkins
  date: '2026-08-14'
  year: '2026'
  journ: npj Sustainable Mobility and Transport
  volume: '3'
  issue: '1'
  pub_number: doi:10.1038/s44333-026-00123-2
  doi: 10.1038/s44333-026-00123-2
  arxiv: '2510.08611'
  path: https://doi.org/10.1038/s44333-026-00123-2
  url_source: https://doi.org/10.1038/s44333-026-00123-2
  url_preprint: https://arxiv.org/abs/2510.08611
  categories:
  - Ecological Economics
  type: article
  description: 'Anthropogenic greenhouse gas (GHG) emissions vary spatially with development patterns,
    climate, economic structure, and energy systems. Using Vulcan v4.0 fossil-fuel CO2 (FFCO2) data for
    the United States at 1-km resolution, this study examines how land use and infrastructure shape emissions
    at local and metropolitan scales. I combine doubly robust Bayesian Additive Regression Tree estimators
    with multi-treatment spatial regression models to identify local and spillover effects by sector.
    A key methodological contribution is treating transportation emissions as production-based, capturing
    infrastructure carbon burden rather than household-attributed travel demand. Results show strong scale
    dependence and spatial interaction: in the preferred heteroscedasticity-robust SEM+SLX model with
    a 10-km distance band, residual spatial autocorrelation declines substantially. Local roadway design
    is a strong negative predictor of transportation FFCO2, while neighbouring land use diversity exceeds
    local diversity. In residential sectors, higher local density is consistently associated with lower
    per-capita emissions. These findings support coordinated multi-scale mitigation policy in the United
    States.'
- title: A Pseudo Panel Difference-in-Differences (DiD) Analysis of Online Shopping Behavior in the Puget
    Sound Regional Council (PSRC) Region
  author: Jason Hawkins, Usman Ahmed, Omid Armantalab
  date: '2026-07-04'
  year: '2026'
  journ: arXiv Preprint
  pub_number: arXiv:2607.03665
  doi: 10.48550/arxiv.2607.03665
  arxiv: '2607.03665'
  path: https://doi.org/10.48550/arxiv.2607.03665
  url_preprint: https://doi.org/10.48550/arxiv.2607.03665
  categories:
  - General Transport
  type: preprint
  description: Online shopping is a growing trend, particularly following the COVID-19 lock-downs enacted
    by many cities. Understanding these trends requires robust panel dat methods. However, panel data
    (i.e., with repeated measurements of the same observational units) are often unavailable. In this
    study, we use a propensity score weighting (PSW) approach to adjust repeated cross-sectional travel
    diary surveys collected in the Puget Sound Regional Council (PSRC) region. The most common home delivery
    is packages (2.09 days per week in 2023), followed by food (0.36 days per week in 2023). We find that
    single-family detached and townhouse residents tend to receive more home deliveries than those living
    in apartments. We also find a difference in several patterns pre- and post-COVID pandemic. Vehicle
    deficient households did not exhibit the same increase in home delivery frequency as other households
    pre-COVID, but the pattern reversed in the post-COVID period - i.e., vehicle deficient households
    saw a relative increase in delivery frequency. Overall, this study demonstrates the pseudo-panel approach
    to causal inference by leveraging differences in PSW-weighted in delivery frequency across treatment
    groups.
- title: 'Residential Price Modeling Using Spatially Validated Machine Learning Methods: A Comparison
    Across Geographical Contexts'
  author: Usman Ahmed, Jason Hawkins
  date: '2026-07-03'
  year: '2026'
  journ: Transportation Research Record Journal of the Transportation Research Board
  pub_number: doi:10.1177/03611981261457410
  doi: 10.1177/03611981261457410
  arxiv: '2609.00375'
  path: https://doi.org/10.1177/03611981261457410
  url_source: https://doi.org/10.1177/03611981261457410
  url_preprint: https://arxiv.org/abs/2609.00375
  categories:
  - General Transport
  type: article
  description: Land use (i.e., buildings) and transportation infrastructure are tightly coupled systems,
    such that residential property prices play a critical role in transportation planning. In a similar
    manner, transportation infrastructure influences property prices, such that accurate forecasts of
    both systems are related research problems. The objective of this study is to examine these interactions
    and evaluate the effectiveness of machine learning methods in modeling residential real estate prices
    across different urban contexts. Specifically, we first examine the impact of land and transportation
    infrastructure on residential real estate prices using Extreme Gradient Boosting (XGBoost) and Random
    Forest (RF) machine learning methods, and compare results between two cities representing diverse
    geographic and socioeconomic contexts. Second, we investigate the application of machine learning
    methods on spatial data and provide a comparison of non-spatial and spatial cross-validation on the
    performance of machine learning methods. We use SHapley Additive exPlanations (SHAP) values to study
    the impact of land use and transportation infrastructure on real estate prices. The models are applied,
    and results are compared between the Rawalpindi and Islamabad Metropolitan Area in Pakistan and the
    City of Toronto in Canada. We find that, despite differences in demographics and economic development,
    the two cities exhibit similarities in the effect of transportation infrastructure and local amenities
    on dwelling prices. Proximity to the major central city cores (i.e., downtowns) increases sale price.
    The effect of transportation infrastructure is differentiated, with high quality transit (e.g., subway
    and BRT) increasing and conventional bus stop proximity decreasing sale price, respectively. We confirm
    the previous finding in other fields that non-spatial cross-validation over-estimates the prediction
    accuracy of machine learning algorithms on spatially referenced datasets. We find that the XGBoost
    model has slightly higher performance than the RF model. We recommend careful use of machine learning
    methods in the case of spatial data specifically in modeling of land prices.
- title: 'Modeling Mode and Departure Time Responses to Congestion Pricing: A Spatial and Behavioral Analysis
    Using Cross-Nested Logit Model'
  author: Mohammad Amin Ashena, Adam Weiss, Jason Hawkins, Lina Kattan
  date: '2026-06-29'
  year: '2026'
  journ: arXiv Preprint
  pub_number: arXiv:2606.29756
  doi: 10.48550/arxiv.2606.29756
  arxiv: '2606.29756'
  path: https://doi.org/10.48550/arxiv.2606.29756
  url_preprint: https://doi.org/10.48550/arxiv.2606.29756
  categories:
  - Choice Model Methods
  - Infrastructure Finance
  type: preprint
  description: Effective congestion management strategies require a detailed understanding of how travellers
    respond to different pricing interventions. This paper presents an in-depth analysis of traveller
    behaviour under congestion pricing scenarios, focusing specifically on mode and departure time decisions.
    Utilizing stated preference survey data from commuters in Calgary, Canada, three discrete choice models
    including Multinomial Logit, Nested Logit, and Cross-Nested Logit are developed and compared. Results
    indicate that the Cross-Nested Logit model provides superior behavioural realism and flexibility by
    capturing simultaneous substitutions across modes and departure times. Spatial analysis and elasticity
    assessments reveal substantial geographic variation in traveller sensitivity to pricing, particularly
    highlighting stronger responses among commuters travelling to high-demand central locations and during
    peak travel periods. Further elasticity analyses clarify behavioural patterns, identifying traveller
    groups with varying degrees of flexibility. Policy analyses underscore the effectiveness of targeted,
    dynamic tolling, particularly cordon-based pricing combined with time-specific toll adjustments, in
    reducing congestion levels. Additionally, the findings highlight the necessity of complementary measures,
    including improved transit services and targeted discounts, to ensure equitable outcomes. The findings
    offer targeted insights into how specific pricing strategies such as cordon, distance, and travel
    time-based tolls can be used to influence travel behaviour, reduce peak-period congestion, and guide
    equitable policy design in urban transportation planning.
- title: 'Understanding traveller behaviour under congestion pricing: A survey-based decision tracking
    approach'
  author: Mohammad Amin Ashena, Adam Weiss, Jason Hawkins, Lina Kattan
  date: '2026-05-15'
  year: '2026'
  journ: Transportation Research Interdisciplinary Perspectives
  volume: '38'
  page: 102048–102048
  pub_number: doi:10.1016/j.trip.2026.102048
  doi: 10.1016/j.trip.2026.102048
  path: https://doi.org/10.1016/j.trip.2026.102048
  url_source: https://doi.org/10.1016/j.trip.2026.102048
  categories:
  - Choice Model Methods
  - Infrastructure Finance
  type: article
  description: This paper examines commuter responses to three congestion pricing (CP) schemes including
    cordon-based, distance-based, and travel time–based in Calgary, Canada. The study uses an efficiently
    structured, personalized stated preference survey that integrates sociodemographic information, revealed
    commuting patterns, and responses to hypothetical CP scenarios, with a focus on joint mode and departure-time
    decisions. A key contribution of this study lies in the survey design, which records respondents’
    interactions with the choice interface and identifies the alternatives actively examined during each
    choice task. This information is used to estimate a tracked multinomial logit model in which the choice
    set is restricted to alternatives genuinely considered by each respondent. Comparison with a conventional
    non-tracked specification shows that assuming full consideration of all displayed alternatives inflates
    sensitivity to travel time, cost, and toll attributes. By contrast, the tracked model yields more
    moderate elasticities and parameter estimates that better reflect observed decision-making behaviour.
    Applied to the congestion pricing context, the results suggest shifts towards transit and ridesharing
    under certain pricing structures, highlighting how pricing design can influence peak-period travel
    decisions. Overall, the findings demonstrate that incorporating interaction-tracking data into stated
    preference surveys enhances the behavioural credibility and policy relevance of model-based evaluations
    of congestion pricing strategies.
- title: Why Do We Need Travel Behavior Theory in the Age of AI? Multiple Goal Pursuit as an Illustrative
    Theory
  author: Jason Hawkins, Omid Armantalab
  date: '2026-05-11'
  year: '2026'
  journ: Research Square Preprint
  pub_number: doi:10.21203/rs.3.rs-8811117/v1
  doi: 10.21203/rs.3.rs-8811117/v1
  arxiv: '2606.29145'
  path: https://doi.org/10.21203/rs.3.rs-8811117/v1
  url_preprint: https://doi.org/10.21203/rs.3.rs-8811117/v1
  categories:
  - Choice Model Methods
  - Vehicle Adoption
  type: preprint
  description: 'Abstract Travel behavior and demand modeling seeks to understand the factors that motivate
    transportation decisions. At the same time, the field is increasingly adopting algorithmic and artificial
    intelligence (AI) tools that improve predictive accuracy, often at the cost of a grounding in hypothesis-based
    theory validation and behavioural explanation. In this discussion paper, we use goal pursuit theory
    (GPT) to illustrate why behavioral theory is a necessary complement to prediction in travel behavior
    research. Unlike random utility maximization (RUM) or close alternatives (e.g., random regret minimization
    (RRM)), GPT explicitly models how travelers (1) activate context-dependent goals (hedonic, gain, normative),
    (2) resolve conflicts between competing objectives, and (3) make sequential decisions across temporal
    scales. We demonstrate GPT''s merits through three transport applications: activity scheduling (handling
    hierarchical goal structures), vehicle ownership (disentangling bundled mobility goals), and location
    choice (capturing latent goal interactions via matrix factorization). We provide actionable guidance
    for implementation, including: (a) hybrid choice model specifications linking goals to observable
    behaviors, (b) parallels to complementary behavioral theories from the transportation field, and (c)
    data requirements and comparative benchmarks against RUM/RRM models.'
