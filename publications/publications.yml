- title: 'Report 4: Evaluating the Impacts of Private Transportation Companies on Travel Behaviour through
    a Stated Preference (SP) Survey'
  author: Patrick Loa, Jason Hawkins, Khandker Nurul Habib
  date: '2019-05-01'
  year: '2019'
  journ: TSpace (University of Toronto)
  path: http://hdl.handle.net/1807/100487
  url_source: http://hdl.handle.net/1807/100487
  categories:
  - Choice Model Methods
  - Shared Mobility
  type: report
  description: 'This technical report presents the work undertaken in support of the City of Toronto’s
    Vehicle for Hire Bylaw Review by the University of Toronto Transportation Research Institute (UTTRI)
    and it presents the analysis of the factors that influence the residents’ (of the City of Toronto)
    choices of using or not using exclusive and shared ride-hailing services in the City. The investigation
    is based on data obtained through a specialized travel survey that uses a Stated Preference (SP) technique
    build on Revealed Preference (RP) information of daily travel. The survey, named the “Survey to Predict
    the Repercussions of the Introduction of Novel Transportation Network Services”: (SPRINT), collected
    information from a random sample of residents (selected from a market research panel) of the City
    of Toronto. Respondents were asked a series of questions pertaining to personal and household characteristics,
    information on the extent to which respondents use ride-hailing services, and their familiarity with
    and perceptions of ride-hailing services. In addition, respondents were asked to complete a series
    of real (revealed) and hypothetical (stated) preference questions, which were used to understand the
    trade-offs that people make when choosing a mode of travel in the City. The rest of this report is
    organized as follows. Section 2 summarizes the goals of and motivation for the survey and presents
    a discussion of the factors that influenced the design of each component of the survey. Section 3
    provides an analysis of the data obtained through the SPRINT. The analysis of the results is comprised
    of three elements: descriptive statistics, usage, and perceptions of ride-hailing services, and model
    results. Section 4 summarizes the key findings of the report.'
- title: Spatial statistical analysis of infrastructure systems in Calgary, Alberta
  author: Jason Hawkins, Lina Kattan, J. Patrick A. Hettiaratchi, Joshua Taron, Getachew Assefa
  date: '2019-01-01'
  year: '2019'
  journ: Journal of Environmental Planning and Management
  volume: '62'
  issue: '11'
  page: 1929–1948
  pub_number: doi:10.1080/09640568.2018.1523052
  doi: 10.1080/09640568.2018.1523052
  path: https://doi.org/10.1080/09640568.2018.1523052
  url_source: https://doi.org/10.1080/09640568.2018.1523052
  categories:
  - General Transport
  type: article
  description: In this paper, the consumption of various infrastructure systems in Calgary, Alberta by
    residential, commercial, and industrial sectors is considered. Statistical models are developed to
    quantify the influences of built form factors, in addition to traditional factors of sociodemography.
    Analyses are performed by census community for electricity, transportation by mode of travel, and
    demolition permits by their size and frequency. The employment of a common methodology in a single
    geography allows for comparison across infrastructure systems and determination of common patterns.
    Assessing total consumption does not necessarily lead to a consistent interpretation. By differentiating
    electricity consumption by sector and transportation by mode, consistent analysis can be conducted
    that identifies the correct relationships. We find a trend toward increasing consumption of electricity
    use moving out from the center of the city, but also an increasing reliance on the private automobile.
- title: Spatio-Temporal Hedonic Price Model to Investigate the Dynamics of Housing Prices in Contexts
    of Urban Form and Transportation Services in Toronto
  author: Jason Hawkins, Khandker Nurul Habib
  date: '2018-06-08'
  year: '2018'
  journ: Transportation Research Record Journal of the Transportation Research Board
  volume: '2672'
  issue: '6'
  page: 21–30
  pub_number: doi:10.1177/0361198118774153
  doi: 10.1177/0361198118774153
  path: https://doi.org/10.1177/0361198118774153
  url_source: https://doi.org/10.1177/0361198118774153
  categories:
  - Infrastructure Finance
  type: article
  description: A spatio-temporal hedonic price model is developed for the Greater Toronto area to examine
    the effects of urban configurations and proximity to transit services on housing price. A spatial
    Durbin panel model is utilized to account for both spatial and temporal autocorrelation. This model
    is shown to have advantages through its ability to reduce the number of explanatory variables required
    to obtain a strong fit with empirical data. Analysis is completed for the period of 1996 to 2017 and
    distinctions are made in housing stock between single-family houses, townhouses, and condominiums.
    It is shown that heterogeneities exist between the hedonic representations of each dwelling type and
    that separate models should be employed for each. In all cases, the average income of the community,
    its distance to the central business district (CBD), and population and employment density are found
    to be significant factors in the determination of price.
- title: Development of environmentally extended social accounting matrices for policy analysis in Alberta
  author: Jason Hawkins, John Douglas Hunt
  date: '2018-05-24'
  year: '2018'
  journ: Economic Systems Research
  volume: '31'
  issue: '1'
  page: 114–131
  pub_number: doi:10.1080/09535314.2018.1474854
  doi: 10.1080/09535314.2018.1474854
  path: https://doi.org/10.1080/09535314.2018.1474854
  url_source: https://doi.org/10.1080/09535314.2018.1474854
  categories:
  - Ecological Economics
  type: article
  description: 'This paper outlines the development of inputs to an integrated land use and transportation
    model based on a series of environmentally extended social accounting matrices (SAMs) for the Canadian
    province of Alberta. A novel form of industry disaggregation is employed, based on aggregate iterative
    proportion and a unique formulation of location quotients. Social accounts are extended via the inclusion
    of detailed household consumption broken down by income quintiles. The SAMs are developed from supply-use
    matrices. Physical flow accounts are framed as derived demands, acting as necessary inputs to the
    production of downstream goods and services. Applications to regional economic modeling are considered,
    as planning authorities increasingly seek to model the environmental impacts of policy. The SAMs are
    then applied to the assessment of two technology change scenarios: a shift in the provincial electricity
    generation mix and a transition to a fully electric private automobile fleet.'
- title: Integrated models of land use and transportation for the autonomous vehicle revolution
  author: Jason Hawkins, Khandker Nurul Habib
  date: '2018-03-12'
  year: '2018'
  journ: Transport Reviews
  volume: '39'
  issue: '1'
  page: 66–83
  pub_number: doi:10.1080/01441647.2018.1449033
  doi: 10.1080/01441647.2018.1449033
  path: https://doi.org/10.1080/01441647.2018.1449033
  url_source: https://doi.org/10.1080/01441647.2018.1449033
  categories:
  - Vehicle Adoption
  type: article
  description: The advent of the autonomous vehicle (AV) will affect not only the transportation system,
    but also future patterns of land development. Integrated land use and transportation models will be
    critical tools in assessing the path forward with this technology. Key questions with respect to land
    use impacts of AVs arise from potential changes in sensitivity to travel and reduced demand for parking.
    It is an open question whether AVs will induce urban sprawl, or whether spatial economies of agglomeration
    will mitigate any reductions in travel time sensitivity. The deployment of shared fleets of AVs would
    likely reduce parking demand, producing yet to be explored impacts on property development within
    existing urban footprints. We perform a critical assessment of currently operational models and their
    ability to represent the adoption of AVs. We identify the representation of time in such models as
    a vital component requiring additional development to model this new technology. Existing model applications
    have focused on the discrete addition of new infrastructure or policy at a fixed point in time, whereas
    AV adoption will occur incrementally through time. Stated adaptation surveys are recommended as tools
    to quantify preferences and develop relevant model inputs. It is argued that existing models that
    assume comparatively static equilibrium have been convenient in the past, but are insufficient to
    model technology adoption. In contrast, dynamic model frameworks lack sufficient structure to maintain
    reasonability under large perturbations from base conditions. The ongoing advancement of computing
    has allowed models to move away from being mechanistic aggregate tools, towards behaviourally rich
    depictions of individual persons and firms. However, much work remains to move from projections of
    existing conditions into the future, to the evolution of the spatial economy as it evolves through
    time in response to new technologies and exogenous stresses. Principles from complex and evolutionary
    systems theory will be important in the development of models with the capacity to consider such dynamics.
- title: 'Microsimulating Heterogeneous Traffic: An Implementation of the Porous Flow Approach'
  author: Jason Hawkins, Lina Kattan
  date: '2018-01-11'
  year: '2018'
