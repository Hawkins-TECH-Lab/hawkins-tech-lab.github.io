- title: Bus headway optimization with consumer surplus as a measure of societal benefit
  author: Jason Hawkins, S. C. Wirasinghe, John Douglas Hunt
  date: '2020-02-19'
  year: '2020'
  journ: International Journal of Urban Sciences
  volume: '25'
  issue: '1'
  page: 86–103
  pub_number: doi:10.1080/12265934.2020.1730224
  doi: 10.1080/12265934.2020.1730224
  path: https://doi.org/10.1080/12265934.2020.1730224
  url_source: https://doi.org/10.1080/12265934.2020.1730224
  categories:
  - Choice Model Methods
  type: article
  description: This paper derives the square root bus dispatch optimization developed by Newell from consumer
    surplus rather than the original cost minimization function. We then extend the model to consider
    dispatch-variant demand and outline its property relative to the original model by Newell. Demand
    elasticity is introduced via a multinomial logit mode choice model. Results are tested for City of
    Edmonton mode choice and ridership. The sensitivity of the function to wait time cost and passenger
    demand is tested. For the observed passenger demand and value of travel time, our analysis suggests
    there is a portion of riders who are captive and will suffer increasing wait time costs, but many
    passengers will make the choice to utilize other modes of travel when faced with increasing bus headways.
- title: 'A joint model of place of residence (POR) and place of work (POW): Making use of Gibbs sampling
    technique to overcome arbitrary assumptions in contexts of data limitation'
  author: Hengyang Zhang, Jason Hawkins, Khandker Nurul Habib
  date: '2019-12-03'
  year: '2019'
  journ: Journal of Transport and Land Use
  volume: '12'
  issue: '1'
  page: 873–892
  pub_number: doi:10.5198/jtlu.2019.1624
  doi: 10.5198/jtlu.2019.1624
  path: https://doi.org/10.5198/jtlu.2019.1624
  url_source: https://doi.org/10.5198/jtlu.2019.1624
  categories:
  - Choice Model Methods
  type: article
  description: Place or residence (POR) and place of work (POW) are two spatial pivots defining patterns
    of travel behavior. These choices are considered part of long-term choice influencing short-term daily
    travel choices. Hence, POR-POW distributions are input into almost all daily travel demand models.
    However, in many cases, POW-POR is modelled in an ad-hoc way considering the gravity-based or entropy
    is maximizing aggregate modelling approach. Lack of data on the sequence of choices related to POR
    and POW is often blamed for avoiding using disaggregate choice model. Recognizing such data limitation,
    this paper presents an alternative methodology of modelling joint distribution of POW-POW that uses
    disaggregate choice models without necessarily knowing the sequence of POR and POW choices. It uses
    the conditional probability break downs of joint POR-POW choice probabilities as depicted in the Gibbs
    sampling approach. This allows capturing effects of household socioeconomic characteristics, zonal
    land-use characteristics, and modal accessibility factors in the POR-POW models. The model is applied
    for a case study in the city of Ottawa. Results reveal that the proposed methodology can replicate
    observed patterns of POR-POW with a high degree of accuracy.
- title: Household-level dynamics in residential location choice modelling with a latent auction method
  author: Jason Hawkins, Adam Weiss, Khandker Nurul Habib
  date: '2019-09-04'
  year: '2019'
  journ: Environment and Planning B Urban Analytics and City Science
  volume: '48'
  issue: '2'
  page: 314–330
  pub_number: doi:10.1177/2399808319871308
  doi: 10.1177/2399808319871308
  path: https://doi.org/10.1177/2399808319871308
  url_source: https://doi.org/10.1177/2399808319871308
  categories:
  - Choice Model Methods
  type: article
  description: A longstanding deficiency in the modelling of residential location choices is the common
    assumption of a single household decision-maker. This paper contributes to a growing literature on
    methods to capture intra-household dynamics in this decision process. A latent auction approach is
    employed to estimate a residential location choice model for the Greater Toronto Area. The present
    work extends the consideration of individual utility factors beyond simple commute time, to include
    frequency of automobile use, transit use, and the cost of parking at the destination. Results suggest
    a weakening differential between male and female roles in the residential location choice, as multi-worker
    households are increasing in response to increasing costs of living. The strength of the latent auction
    model is confirmed as a means of linking bid-rent with observed market prices. Several conclusions
    are drawn out of the model results, including a pattern of larger households preferring the larger
    and cheaper houses characteristic of suburban areas of the Greater Toronto Area.
