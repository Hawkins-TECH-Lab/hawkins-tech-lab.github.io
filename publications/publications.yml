- title: Anticipating Current and Coming Technologies that Affect U.S. Travel Choices
  author: Jason Hawkins, Kara Maria Kockelman, Kai Huang
  date: '2023-05-24'
  year: '2023'
  journ: Transportation Research Record Journal of the Transportation Research Board
  volume: '2677'
  issue: '12'
  page: 449–462
  pub_number: doi:10.1177/03611981231168856
  doi: 10.1177/03611981231168856
  path: https://doi.org/10.1177/03611981231168856
  url_source: https://doi.org/10.1177/03611981231168856
  categories:
  - Vehicle Adoption
  type: article
  description: Understanding the preferences for new and future transportation technologies is important
    to ensure an efficient and equitable future transportation system. A survey was conducted of Americans’
    preferences for several such technologies. Americans are concerned about vehicle range and charging
    station availability for electric vehicles (EVs) and hesitant about autonomous vehicle (AV) safety.
    Opinions about many transportation technologies, such as vertical takeoff and landing (i.e., air taxis),
    shared parking, and air-drone delivery are mixed. These less familiar technologies require continued
    tracking of preferences. A 55% increase is estimated in the probability of an individual choosing
    a battery electric vehicle (BEV) pickup truck if its fuel economy increases by about 9%. This result
    supports a market for BEV pickup trucks currently under development by many automakers. The preference
    for vehicle autonomation appears to depend on the use case. Driving task automation is preferred by
    residents of low-density, car-dependent areas where long commutes are common. In contrast, automated
    parking technologies are favored by those living in denser communities. Intermittent bus lanes are
    favored by those living in high population density areas, but not among those in areas with high shares
    of zero-vehicle households. These results provide indications of where to direct future research in
    the field.
