- title: 'The taxi sharing practices: Matching, routing and pricing methods'
  author: Jianrong Qiu, Kai Huang, Jason Hawkins
  date: '2022-03-01'
  year: '2022'
  journ: Multimodal Transportation
  volume: '1'
  issue: '1'
  page: 100003–100003
  pub_number: doi:10.1016/j.multra.2022.100003
  doi: 10.1016/j.multra.2022.100003
  path: https://doi.org/10.1016/j.multra.2022.100003
  url_source: https://doi.org/10.1016/j.multra.2022.100003
  categories:
  - Choice Model Methods
  - Ecological Economics
  - Shared Mobility
  type: article
  description: 'Taxi sharing is becoming a trendy travel mode in an increasing number of cities. By encouraging
    two or more passengers to share a taxi, taxi sharing can cut down travel costs, reduce traffic emissions,
    and relieve traffic congestion. To promote taxi sharing, this paper first reviews the existing taxi
    sharing practices in cities. The entire process of taxi sharing can be broken up into the following:
    matching, route choice, and pricing. The current situation is revealed, as well as prospects for future
    developments. Building on the review, new approaches are proposed to taxi sharing matching, route
    choice modelling, and pricing schemes to improve taxi sharing practices and broaden their application.'
- title: 'The evolution of choice set formation in dwelling and location with rising prices: A decadal
    panel analysis in the Greater Toronto Area'
  author: Jason Hawkins, Khandker Nurul Habib
  date: '2021-11-21'
  year: '2021'
  journ: Journal of Transport and Land Use
  volume: '14'
  issue: '1'
  page: 1227–1247
  pub_number: doi:10.5198/jtlu.2021.1854
  doi: 10.5198/jtlu.2021.1854
  path: https://doi.org/10.5198/jtlu.2021.1854
  url_source: https://doi.org/10.5198/jtlu.2021.1854
  categories:
  - Choice Model Methods
  type: article
  description: 'Home location choice is based on both the characteristics of the dwelling (e.g., size,
    style, number of bedrooms) and the location (e.g., proximity to work, quality of schools, accessibility).
    Recent years have seen a steep increase in the price of housing in many major cities. In this research,
    we examine how these price increases are affecting the types of dwelling and locations considered
    by households. A large sample of real estate listings from 2006 and 2016 from the Greater Toronto
    Area is used to develop the empirical models. Two recently developed discrete choice models are used
    in the study: a nested logit model with latent class feedback (LCF) and a semi-compensatory independent
    availability logit (SCIAL) model. A method of alternative aggregation is proposed to overcome the
    computational hurdle that often impedes the estimation of choice set models. We find a significant
    increase in the probability of larger households considering townhouses and apartments over detached
    single-family dwellings between 2006 and 2016.'
- title: 'Bayesian estimation of discrete choice models: a comparative analysis using effective sample
    size'
  author: Jason Hawkins, Khandker Nurul Habib
  date: '2021-10-30'
  year: '2021'
  journ: Transportation Letters
  volume: '14'
  issue: '10'
  page: 1091–1099
  pub_number: doi:10.1080/19427867.2021.1991554
  doi: 10.1080/19427867.2021.1991554
  path: https://doi.org/10.1080/19427867.2021.1991554
  url_source: https://doi.org/10.1080/19427867.2021.1991554
  categories:
  - Choice Model Methods
  type: article
  description: In this paper, we provide a comparison of implementations of Bayesian estimation of mixed
    multinomial logit (MMNL) models. Our objective is to provide a systematic comparison of the runtime,
    efficiency, and model implementation details associated with several alternative workflows. The analysis
    is based on three case studies. We argue that previous comparisons in the transportation literature
    have lacked appropriate metrics for comparison. Effective sample size statistics are proposed as a
    means of accurately comparing the ability of Bayesian samplers to generate independent draws for use
    in statistical inference. The Allenby-Train algorithm implemented in the R package Apollo is compared
    with the NUTS sampler implemented in Stan. While the Allenby-Train algorithm tends to generate draws
    much faster than NUTS, we find that the high correlation between success samples makes the two methods
    comparable. In addition to traditional MCMC sampling, we also examine the method of variational Bayes
    (VB).
- title: Effects of built environment and weather on demands for transportation network company trips
  author: Md Sami Hasnine, Jason Hawkins, Khandker Nurul Habib
  date: '2021-06-23'
