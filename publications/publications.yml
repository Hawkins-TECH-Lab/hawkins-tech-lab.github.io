- title: Investigating the Effects of COVID-19 Pandemic on the Perception of Residential Accessibility
    in Greater Toronto and Hamilton Area
  author: Saeed Shakib, Jason Hawkins, Khandker Nurul Habib
  date: '2022-04-28'
  year: '2022'
  journ: Transportation Research Record Journal of the Transportation Research Board
  volume: '2678'
  issue: '12'
  page: 30–46
  pub_number: doi:10.1177/03611981221086640
  doi: 10.1177/03611981221086640
  path: https://doi.org/10.1177/03611981221086640
  url_source: https://doi.org/10.1177/03611981221086640
  categories:
  - Infrastructure Finance
  type: article
  description: This paper investigates the changes caused by the COVID-19 pandemic on households’ perceived
    utility of the accessibility of their residence in the Greater Toronto and Hamilton Area (GTHA). The
    paper considers several neighborhood and dwelling attributes and fuses those with property price data
    from mid-March 2019 to mid-March 2021 to analyze changes in housing trends before and during the COVID-19
    pandemic. Two mixed geographically weighted regression (MGWR) models are estimated for the year before
    the start of the pandemic and the year during the pandemic to address spatial autocorrelation and
    non-stationarity in price data. The empirical models reveal new patterns in accessibility perception
    for some factors, including accessibility to regional subway and inter-regional rail transit. This
    study also contributes to the literature of MGWR modeling by assessing the capacity of the model through
    validation procedures. Estimation is performed on randomly selected samples from the population to
    compare the errors with the population-based model and a traditional hedonic price model. The findings
    suggest that the application of MGWR is restricted to cases where price data are abundant.
