- title: 'Transportation Sector in Environmentally-Extended Economic Modelling: Case Study of Alberta,
    Canada'
  author: Jason Hawkins, John Douglas Hunt
  date: '2016-01-01'
  year: '2016'
  journ: Transportation Research Board 95th Annual MeetingTransportation Research Board
  path: https://trid.trb.org/view.aspx?id=1394537
  url_source: https://trid.trb.org/view.aspx?id=1394537
  categories:
  - Ecological Economics
  type: article
  description: The inclusion of environmental metrics is an integral part of a complete representation
    of the socio - economic system of a region. This research had the aim of advancing an economic input
    - output model of the Canadian province of Alberta, with extension to environmental accounts. This
    involved the development of a detailed account of inter - industry transactions and consumption of
    goods and services by households, government, and capital formation. The provincial input - output
    model of Alberta - developed by Statistics Canada as part of its 2010 System of National Accounts
    - was substantially expanded to include a more granular representation of industries, commodities,
    and agents of final demand. Environmental accounts were developed for energy use, water use, and the
    production of greenhouse gas emissions. This work produced an expansive model with a variety of potential
    avenues for retrospective and policy analysis. Transportation contributes approximately one quarter
    of all such emissions in an industrialized economy. This paper summarizes model results for this sector,
    specifically the industries with high demands for transportation services and the contributions of
    personal transportation delineated by income quintile. Results confirm the importance of transportation
    to the provincial economy and any potential environmental policies. This research involved the development
    of a novel representation of environmental metrics for use by industry and agents of final demand.
    This approach is described and potential extensions identified within the transportation – land use
    modelling field.
- title: 'Environmentally-Extended Economic Models: Development and Application to Carbon Pricing and
    Technology Change in Alberta, Canada'
  author: Jason Hawkins
  date: '2016-01-01'
  year: '2016'
  journ: Libraries and Cultural Resources (University of Calgary)
  pub_number: doi:10.11575/prism/25918
  doi: 10.11575/prism/25918
  path: https://doi.org/10.11575/prism/25918
  url_source: https://doi.org/10.11575/prism/25918
  categories:
  - Ecological Economics
  - Infrastructure Finance
  type: dissertation
  description: 'This thesis develops a detailed environmental-economic model of the province of Alberta.
    Methods are developed for utilizing a variety of statistical data sources to develop disaggregate
    provincial input-output models based on the national Canadian model. The model is extended to include
    physical flows of water, energy, and greenhouse gas emissions. A new approach to distributing physical
    flows is developed that considers physical flows as derived demands to satisfy the needs of utility
    maximizing industrial and household activities. This framework is applied to analysis of carbon pricing
    at the provincial scale and results presented. Detailed representations of household consumption and
    electricity generation are utilized to better assess the effects of carbon pricing and where redistributive
    measures should be applied. The model is then applied to assessment of three technology change scenarios:
    a shift in the provincial electricity generation mix, a transition to a fully electric private automobile
    fleet, and a partial change in the non-residential construction industry to reduce concrete use and
    increase use of wood in construction.'
